name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, alembic, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lesebuddy
          POSTGRES_PASSWORD: lesebuddy
          POSTGRES_DB: lesebuddy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lesebuddy -d lesebuddy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # CI only ever needs one database; point both at it so the alembic CLI
      # (which falls back to DATABASE_URL) and the pytest fixtures (which use
      # TEST_DATABASE_URL) agree on where "the test database" is.
      DATABASE_URL: postgresql+psycopg://lesebuddy:lesebuddy@localhost:5432/lesebuddy_test
      TEST_DATABASE_URL: postgresql+psycopg://lesebuddy:lesebuddy@localhost:5432/lesebuddy_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Apply migrations to the test database
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  quality:
    name: Quality (pre-commit, PR title)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          # frontend-lint just shells out to `npm run lint`; the frontend job
          # already runs that natively, so skip it here instead of installing
          # Node + node_modules a second time just to duplicate the check.
          SKIP: frontend-lint

      - name: Validate PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
