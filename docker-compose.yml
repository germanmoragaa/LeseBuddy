services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lesebuddy
      POSTGRES_PASSWORD: lesebuddy
      POSTGRES_DB: lesebuddy
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lesebuddy -d lesebuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
